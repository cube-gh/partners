<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>거래처 목록</title>
<script>try{var t=localStorage.getItem("pl_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 딥 네이비 + 골드 */
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--ink:#1E2433;--sub:#6E7280;--line:#E7E2D7;
  --head:#1F2A44;--head-2:#26324F;
  --pri:#1F2A44;--on-pri:#FFFFFF;--pri-soft:#EEEAE1;
  --gold:#B8975A;--gold-ink:#8A6A34;--cat-ink:#5E4519;--gold-soft:#F3ECDD;
  --danger:#A3433A;--ok:#4A7A5C;
  --r:14px;
  --btnbg:#1F2A44;--btnfg:#B8975A;color-scheme:light;
  --serif:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
}
/* 다크: 휴대폰 설정이 다크이고 직접 밝게를 고르지 않았을 때, 또는 직접 다크를 골랐을 때 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151E;--card:#1A2030;--ink:#ECE8DF;--sub:#A2A6B0;--line:#2A3143;
  --head:#161D2E;--head-2:#1E2740;
  --pri:#CDB07A;--on-pri:#1A2030;--pri-soft:#262E42;
  --gold:#CDB07A;--gold-ink:#D6BC88;--cat-ink:#E3C892;--gold-soft:#2A2A2C;
  --danger:#E08273;--ok:#7FB592;
  --btnbg:#CDB07A;--btnfg:#1A2030;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151E;--card:#1A2030;--ink:#ECE8DF;--sub:#A2A6B0;--line:#2A3143;
  --head:#161D2E;--head-2:#1E2740;
  --pri:#CDB07A;--on-pri:#1A2030;--pri-soft:#262E42;
  --gold:#CDB07A;--gold-ink:#D6BC88;--cat-ink:#E3C892;--gold-soft:#2A2A2C;
  --danger:#E08273;--ok:#7FB592;
  --btnbg:#CDB07A;--btnfg:#1A2030;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--head-2),var(--head));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;border-bottom:2px solid var(--gold)}
.top{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.company{font-size:11.5px;color:var(--gold);letter-spacing:1.5px;margin:0 0 3px 12px;font-weight:600}
.top h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;letter-spacing:.5px}
.top h1::before{content:"";display:inline-block;width:3px;height:16px;background:var(--gold);margin-right:9px;vertical-align:-1px;border-radius:2px}
.ibtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#E9DFC9;border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:15px}
.search{margin:12px 0 8px;position:relative}
.search input{width:100%;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:0 14px 0 38px;background:rgba(255,255,255,.95);color:#1E2433}
.search svg{position:absolute;left:12px;top:12px;opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 13px;background:transparent;color:rgba(255,255,255,.82);font-size:14px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1F2A44;font-weight:700}
.chip small{opacity:.75;margin-left:3px}
main{padding:12px 12px 110px;max-width:720px;margin:0 auto}
.status{font-size:13px;color:var(--sub);margin:2px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.group-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--cat-ink);margin:20px 6px 8px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),var(--line) 40%)}
.card{background:var(--card);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(31,42,68,.04);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px}
.row .info{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;background:var(--gold-soft);color:var(--gold-ink);border-radius:6px;padding:1px 6px;margin-right:4px;font-weight:600}
.star{flex:none;width:36px;height:44px;border:0;background:none;font-size:22px;color:var(--line);padding:0;line-height:1}
.star.on{color:var(--gold)}
.star:disabled{opacity:1}
.fav-mark{color:var(--gold);margin-right:4px}
.chip.fav{color:#E9D3A6}
.chip.fav.on{color:#1F2A44}
.card-in{border:1px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.card-in summary{font-weight:700;color:var(--gold-ink);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.card-in summary::-webkit-details-marker{display:none}
.sumchev{width:22px;height:22px;border-radius:6px;background:var(--btnbg);color:var(--btnfg);display:grid;place-items:center;transition:transform .2s}
.card-in[open] .sumchev{transform:rotate(180deg)}
.card-in .note{background:var(--card)}
.card-in textarea.in{background:var(--card)}
.in.filled{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);transition:box-shadow .3s}
.selwrap{position:relative}
.selwrap select.in{appearance:none;-webkit-appearance:none;padding-right:58px;cursor:pointer;font-weight:600}
.selbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:30px;border-radius:8px;background:var(--btnbg);color:var(--btnfg);display:grid;place-items:center;pointer-events:none;box-shadow:0 1px 3px rgba(31,42,68,.2)}
.selwrap:active .selbtn{filter:brightness(1.2)}
.chk-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.chk-row input{width:20px;height:20px;accent-color:var(--gold)}
.call{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri-soft);color:var(--pri);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none}
.detail{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}
.card.open .detail{display:block}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .k{width:62px;flex:none;font-size:13px;color:var(--sub)}
.line .v{flex:1;min-width:0;word-break:break-all}
.line a{color:var(--pri);text-decoration:none;font-weight:600}
.mini{flex:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 9px;font-size:13px;color:var(--pri);text-decoration:none}
.person{padding:9px 0;border-bottom:1px dashed var(--line)}
.person:last-child{border-bottom:0}
.person b{font-size:15px}.person span{font-size:13px;color:var(--sub);margin-left:4px}
.person .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.memo{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.edit-row{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:11px;height:42px;padding:0 16px;background:var(--pri);color:var(--on-pri);font-weight:700}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{height:36px;font-size:14px;padding:0 12px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:50%;border:0;background:var(--head);color:var(--gold);font-size:30px;box-shadow:0 0 0 2px var(--gold),0 8px 20px rgba(31,42,68,.3);z-index:20}
.empty{text-align:center;color:var(--sub);padding:50px 20px;line-height:1.7}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:31;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.sheet.show{transform:none}
.grabzone{position:sticky;top:-8px;z-index:3;margin:-8px -16px 4px;padding:12px 0 10px;background:var(--card);cursor:grab;touch-action:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{touch-action:none;user-select:none}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:2px 0 12px}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.in{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--bg)}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.in{height:90px;padding:10px 12px;resize:vertical}
#people{counter-reset:pp}
.pbox{border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin-top:8px;counter-increment:pp}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plabel{font-size:12.5px;color:var(--sub);font-weight:600}
.plabel::after{content:" " counter(pp)}
.pbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbox .in{height:40px}
.pbox .x{border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:12.5px;font-weight:600;border-radius:8px;height:28px;padding:0 10px}
.sheet .foot{display:flex;gap:8px;margin-top:18px;position:sticky;bottom:0;background:var(--card);padding-top:8px}
.sheet .foot .btn{flex:1}
.catrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.catrow .in{height:40px}
.grip{flex:none;width:34px;height:40px;display:grid;place-items:center;color:var(--sub);font-size:18px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;border-radius:9px}
.grip:active{cursor:grabbing;color:var(--gold-ink)}
.catrow.dragging{position:relative;z-index:2;background:var(--card);border-radius:11px;box-shadow:0 6px 18px rgba(31,42,68,.18);outline:2px solid var(--gold)}
.catrow button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:9px;height:40px;width:40px}
.note{font-size:13px;color:var(--sub);line-height:1.6;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1F2A44;color:#F3ECDD;border:1px solid #B8975A;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:20px}
.lock[hidden]{display:none}
.lockbox{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:28px 20px;text-align:center;border:1px solid var(--line);border-top:3px solid var(--gold);box-shadow:0 8px 28px rgba(31,42,68,.08)}
.lockicon{font-size:38px}.lockbox h2{margin:6px 0 4px;font-size:21px;font-family:var(--serif);font-weight:600;letter-spacing:.5px}
.lockbox p{color:var(--sub);font-size:14px;margin:4px 0 16px}.lockbox .small{font-size:12px;margin:14px 0 0}
.badge{font-size:11px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:2px 7px;font-weight:700;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="company">(주)제주새롬여행사</div><h1>거래처 목록</h1></div>
    <span id="adminBadge" class="badge" hidden>관리자</span>
    <button class="ibtn" id="btnTheme" aria-label="화면 밝기 바꾸기">☾</button>
    <button class="ibtn" id="btnSet" aria-label="설정">⚙︎</button>
  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="회사명·담당자·전화번호 검색">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="status"><span id="count"></span><span id="sync"></span></div>
  <div id="list"></div>
</main>

<button class="fab" id="fab" hidden aria-label="거래처 추가">+</button>

<div class="lock" id="lock" hidden>
  <form class="lockbox" id="lockForm">
    <div class="lockicon" id="lockIcon">🔒</div>
    <h2 id="lockTitle">거래처 목록</h2>
    <p id="lockMsg">거래처 목록 비밀번호를 입력하세요.</p>
    <input class="in" id="lockPw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <button class="btn" id="lockBtn" style="width:100%;margin-top:10px">열기</button>
    <p class="small">한 번 열면 이 기기에서는 다시 묻지 않아요.</p>
  </form>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 기본 설정 ===== */
const DEFAULT_CATS=["여행사","항공","숙박","차량","식당","관광지","유람선","체험관광","토산품","농수산"];
const LS={raw:"pl_raw",cfg:"pl_cfg",pw:"pl_pw",apw:"pl_apw"};
const ICON_CALL='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';

let data={categories:[...DEFAULT_CATS],partners:[],updated:null};
let cfg={owner:"",repo:"",branch:"main",path:"data.json",token:""};
let sha=null, curCat="전체", openId=null, env=null, pw="", apw="", lockMode="view", readPw="";

/* ===== 암호화 (AES-GCM + PBKDF2) ===== */
const toB64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(p,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encrypt(obj,p){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await deriveKey(p,salt),new TextEncoder().encode(JSON.stringify(obj))));
  return {enc:"AES-GCM",v:1,salt:toB64(salt),iv:toB64(iv),data:toB64(ct)};
}
async function decrypt(e,p){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(e.iv)},await deriveKey(p,fromB64(e.salt)),fromB64(e.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel=s=>String(s||"").replace(/[^0-9+]/g,"");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isAdmin=()=>!!(cfg.token&&cfg.owner&&cfg.repo) || !onGithub();
function onGithub(){return /github\.io$/.test(location.hostname)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* GitHub Pages 주소면 저장소 자동 인식 (예: cube-gh.github.io/partners) */
function guessRepo(){
  if(!onGithub())return;
  const owner=location.hostname.split(".")[0];
  const repo=location.pathname.split("/").filter(Boolean)[0]||owner+".github.io";
  if(!cfg.owner)cfg.owner=owner;
  if(!cfg.repo)cfg.repo=repo;
}

/* ===== 불러오기 ===== */
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function apiUrl(p){return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p||cfg.path}`}
/* GitHub에 파일 쓰기 (최신 sha 확인 후 덮어쓰기) */
async function putFile(path,obj,msg){
  const h={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"};
  let s=null; const g=await fetch(apiUrl(path)+"?ref="+cfg.branch+"&t="+Date.now(),{headers:h});
  if(g.ok)s=(await g.json()).sha;
  const body={message:msg,content:b64e(JSON.stringify(obj)),branch:cfg.branch}; if(s)body.sha=s;
  const r=await fetch(apiUrl(path),{method:"PUT",headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error((await r.json()).message||r.status);
  return (await r.json()).content.sha;
}

/* ===== 관리자 링크 (admin.json = 관리자 비밀번호로 잠근 토큰) ===== */
const ADMIN_FILE="admin.json";
const adminLink=()=>location.origin+location.pathname+"#admin";
async function fetchAdminFile(){
  let r=await fetch(ADMIN_FILE+"?t="+Date.now()).catch(()=>null);
  if(r&&r.ok)return r.json();
  if(cfg.owner&&cfg.repo){ // Pages 반영 전이면 GitHub에서 직접
    r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${ADMIN_FILE}?t=${Date.now()}`).catch(()=>null);
    if(r&&r.ok)return JSON.parse(b64d((await r.json()).content));
  }
  return null;
}
async function writeAdminFile(viewPw,adminPw){
  const e=await encrypt({token:cfg.token,owner:cfg.owner,repo:cfg.repo,viewPw},adminPw);
  await putFile(ADMIN_FILE,e,"관리자 설정 저장");
}
/* 관리자 링크가 아직 없을 때: 로그인 화면에서 바로 토큰으로 처음 설정 */
let needAdminSetup=false;
function showTokenLock(msg){
  lockMode="token"; $("#lock").hidden=false; $("#lockTitle").textContent="관리자 처음 설정"; $("#lockIcon").textContent="🔑";
  $("#lockPw").value=""; $("#lockPw").placeholder="GitHub 토큰 (github_pat_…)";
  $("#lockMsg").innerHTML=msg||"관리자 링크가 아직 만들어지지 않았어요.<br>처음 한 번만 GitHub 토큰을 붙여넣어 주세요.";
  setTimeout(()=>$("#lockPw").focus(),50);
}
async function tokenSetup(t){
  t=t.trim();
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});
  if(!r.ok){showTokenLock("토큰이 맞지 않거나 이 저장소 권한이 없어요.<br>토큰을 다시 확인해 주세요.");return}
  const j=await r.json();
  if(j.permissions&&!j.permissions.push){showTokenLock("이 토큰은 수정 권한이 없어요.<br>Contents를 'Read and write'로 다시 발급해 주세요.");return}
  cfg.token=t; lsSet(LS.cfg,cfg); lockMode="view"; needAdminSetup=true; $("#lockPw").value="";
  hideLock(); await load();
  if($("#lock").hidden)finishAdminSetup(); // 잠금이 없으면 바로, 있으면 직원용 비밀번호 입력 뒤 진행
}

async function makeAdminLink(){

async function adminLogin(v){
  const a=await fetchAdminFile();
  if(!a){showTokenLock();return}
  let s; try{s=await decrypt(a,v)}catch(e){$("#lockMsg").textContent="관리자 비밀번호가 맞지 않아요.";$("#lockPw").select();return}
  cfg.token=s.token; cfg.owner=s.owner||cfg.owner; cfg.repo=s.repo||cfg.repo; lsSet(LS.cfg,cfg);
  apw=v; lsSet(LS.apw,v);
  if(s.viewPw){pw=s.viewPw; lsSet(LS.pw,pw)}
  lockMode="view"; $("#lockPw").value=""; hideLock(); toast("관리자로 로그인했어요"); load();

async function fetchRemote(){
  if(cfg.token&&cfg.owner){
    const r=await fetch(apiUrl()+"?ref="+cfg.branch+"&t="+Date.now(),{headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}});
    if(r.status===404){sha=null;setSync("저장소에 data.json 없음 — 첫 저장 시 생성");return null}
    if(!r.ok)throw new Error("GitHub "+r.status);
    const j=await r.json(); sha=j.sha; return JSON.parse(b64d(j.content));
  }
  if(location.protocol.startsWith("http")){
    const r=await fetch("data.json?t="+Date.now());
    if(!r.ok)throw new Error("data.json "+r.status);
    return r.json();
  }
  return null;
}
/* 받아온 내용 적용: 잠긴 파일이면 비밀번호로 풀기 */
async function applyRaw(raw){
  if(raw&&raw.enc){
    env=raw;
    if(!pw){showLock();return false}
    try{data=normalize(await decrypt(raw,pw));readPw=pw;hideLock();render();return true}
    catch(e){pw="";lsSet(LS.pw,"");showLock("비밀번호가 바뀌었어요. 새 비밀번호를 입력하세요.");return false}
  }
  env=null; data=normalize(raw); hideLock(); render(); return true;
}
async function load(){
  const cached=lsGet(LS.raw);
  if(cached)await applyRaw(cached); else render();
  try{
    const raw=await fetchRemote();
    if(!raw){if(!cached)setSync(location.protocol.startsWith("http")?"":"이 기기에만 저장 중");return}
    lsSet(LS.raw,raw);
    if(await applyRaw(raw))setSync(data.updated?"업데이트 "+fmt(data.updated):"불러옴");
  }catch(e){setSync(cached?"오프라인 사본 표시 중":"불러오기 실패");console.warn(e)}
}

async function save(msg,mutate){
  if(!pw){
    const p=await pwSheet("비밀번호 정하기","처음 저장할 때 공용 비밀번호를 정해요. 직원들은 이 비밀번호로 목록을 열어요. GitHub에는 잠긴(암호화된) 파일만 올라가요.");
    if(!p){toast("비밀번호가 없어 저장하지 않았어요");return false}
    pw=p; lsSet(LS.pw,p);
  }
  const remote=!!(cfg.token&&cfg.owner&&cfg.repo);
  // 다른 관리자가 먼저 고친 내용을 덮어쓰지 않도록, 최신 목록을 받아 그 위에 변경을 적용
  let base=data;
  if(remote){
    setSync("최신 목록 확인 중…");
    try{const r=await fetchRemote(); if(r)base=r.enc?normalize(await decrypt(r,readPw||pw)):normalize(r)}
    catch(e){setSync("저장 안 됨");toast("최신 목록을 열지 못해 저장을 멈췄어요. 새로고침 후 다시 해 주세요");return false}
  }
  base=JSON.parse(JSON.stringify(base)); if(mutate)mutate(base);
  base.updated=new Date().toISOString(); data=base;
  const raw=await encrypt(data,pw); env=raw;
  lsSet(LS.raw,raw); render();
  if(!remote){readPw=pw;setSync("이 기기에 저장됨");return true}
  setSync("저장 중…");
  try{
    sha=await putFile(cfg.path,raw,msg||"거래처 목록 수정"); readPw=pw;
    setSync("GitHub 저장 완료 "+fmt(data.updated)); toast("저장했어요 (직원 화면엔 1~2분 뒤 반영)");
    return true;
  }catch(e){setSync("저장 실패");toast("GitHub 저장 실패: "+e.message);return false}
}

function matches(p,q){

  return hay.includes(q);
}
function render(){

  }

/* 손잡이(위쪽 회색 막대)나 제목을 아래로 쓸어내리면 닫기 */
(function(){
  const sh=$("#sheet"); let y0=null,dy=0,t0=0;
  const pt=e=>(e.touches?e.touches[0]:e).clientY;
  function start(e){y0=pt(e);dy=0;t0=Date.now();sh.style.transition="none"}
  function move(e){
    if(y0===null)return; dy=Math.max(0,pt(e)-y0);
    sh.style.transform=`translateY(${dy}px)`; $("#dim").style.opacity=String(Math.max(.15,1-dy/350));
    if(e.cancelable)e.preventDefault();
  }
  function end(){
    if(y0===null)return; y0=null; sh.style.transition="";
    const fast=dy/Math.max(1,Date.now()-t0)>0.5;
    if(dy>110||(fast&&dy>30))closeSheet(); else{sh.style.transform="";$("#dim").style.opacity=""}
  }
  const handle=e=>e.target.closest(".grabzone,.sheet h2");
  sh.addEventListener("touchstart",e=>{if(handle(e))start(e)},{passive:true});
  sh.addEventListener("touchmove",move,{passive:false});
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
  sh.addEventListener("mousedown",e=>{ if(!handle(e))return; start(e);
    const mm=ev=>move(ev),mu=()=>{end();removeEventListener("mousemove",mm);removeEventListener("mouseup",mu)};
    addEventListener("mousemove",mm);addEventListener("mouseup",mu)});
})();
$("#dim").onclick=closeSheet;

/* ===== 명함 글자 → 칸 자동 분류 ===== */
const TITLES="대표이사|대표|회장|사장|부사장|전무|상무|이사|본부장|센터장|지사장|지점장|소장|원장|국장|실장|부장|차장|과장|팀장|대리|계장|주임|사원|매니저|지배인|총지배인|점장|파트장|선임|책임|수석|기장|가이드|Manager|Director|CEO|President";
const DEPT=/[가-힣A-Za-z]+(부|팀|실|과|본부|센터|사업부|지점|지사|파트)$/;
const COMPANY=/(\(주\)|㈜|주식회사|유한회사|\(유\)|여행사|여행|관광|투어|항공|에어|호텔|리조트|펜션|콘도|렌트|렌터카|버스|운수|교통|식당|횟집|레스토랑|가든|유람선|크루즈|마린|농장|농원|수산|영농|토산|특산|체험|랜드|월드|파크|Co\.|Corp|Inc|Ltd|Hotel|Resort|Tour)/i;
function parseCard(text){
  const r={phone:"",fax:"",email:"",company:"",name:"",title:"",mobile:"",extra:[]};
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const phoneRe=/(\+?82[-.\s]?)?0\d{1,2}[-.)\s]?\d{3,4}[-.\s]?\d{4}|1[5-9]\d{2}[-.\s]?\d{4}/g;
  const norm=n=>{n=n.replace(/^\+?82[-.\s]?/,"0").replace(/[^0-9]/g,"");
    if(/^02/.test(n))return n.replace(/^(02)(\d{3,4})(\d{4})$/,"$1-$2-$3");
    if(/^1[5-9]/.test(n))return n.replace(/^(\d{4})(\d{4})$/,"$1-$2");
    return n.replace(/^(0\d{2})(\d{3,4})(\d{4})$/,"$1-$2-$3")};
  const rest=[];
  lines.forEach(line=>{
    let used=false;
    const em=line.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/); if(em&&!r.email){r.email=em[0];used=true}
    // 한 줄에 번호가 여러 개일 수 있음 (T. 064-.. F. 064-..)
    const parts=line.split(/(?=(?:T|Tel|TEL|F|Fax|FAX|M|Mobile|H\.?P|C\.?P|전화|팩스|휴대폰|핸드폰|대표전화|직통)\s*[.:)]?\s*\+?\d)/);
    parts.forEach(pt=>{
      const nums=pt.match(phoneRe); if(!nums)return; used=true;
      nums.forEach(raw=>{
        const n=norm(raw), lab=pt.slice(0,pt.indexOf(raw));
        if(/fax|팩스|^\s*F\b/i.test(lab)){if(!r.fax)r.fax=n}
        else if(/mobile|휴대|핸드폰|H\.?P|C\.?P|^\s*M\b/i.test(lab)||/^01[016789]/.test(n)){if(!r.mobile)r.mobile=n}
        else if(!r.phone)r.phone=n; else if(!r.fax)r.fax=n;
      });
    });
    if(!used&&/www\.|https?:\/\/|\.(com|co\.kr|kr|net)\b/i.test(line)){r.extra.push("홈페이지: "+line.replace(/^(web|homepage|홈페이지)\s*[.:]?\s*/i,""));used=true}
    if(!used&&/(주소|Add|특별자치도|[가-힣]+(시|군|구)\s|[가-힣\d]+(로|길)\s*\d)/.test(line)&&line.length>8){r.extra.push("주소: "+line.replace(/^(주소|Add(ress)?)\s*[.:]?\s*/i,""));used=true}
    if(!used)rest.push(line);
  });
  const tRe=new RegExp("("+TITLES+")","i");
  rest.forEach(line=>{
    if(!r.company&&COMPANY.test(line)&&!tRe.test(line.replace(/대표전화/,""))){r.company=line;return}
    if(tRe.test(line)){
      const endT=new RegExp("("+TITLES+")$","i");
      const toks=line.split(/[\s/|·,]+/).filter(Boolean);
      const tt=toks.filter(w=>endT.test(w)||DEPT.test(w));
      if(!r.title&&tt.length)r.title=tt.join(" ");
      if(!r.name){const nm=toks.find(w=>/^[가-힣]{2,4}$/.test(w)&&!endT.test(w)&&!DEPT.test(w));if(nm)r.name=nm}
      return;
    }
    if(!r.name&&/^[가-힣]{2,4}$/.test(line.replace(/\s/g,""))&&line.replace(/\s/g,"").length<=4){r.name=line.replace(/\s/g,"");return}
    if(!r.company&&COMPANY.test(line)){r.company=line;return}
  });
  if(!r.company){const c=rest.find(l=>l!==r.name&&!tRe.test(l)&&!/^[가-힣]{2,4}$/.test(l.replace(/\s/g,"")));if(c)r.company=c}
  return r;
}
function fillFromCard(text){
  if(!text.trim()){toast("먼저 명함 글자를 붙여넣어 주세요");return}
  const r=parseCard(text), f=$("#pf"), hit=[];
  const set=(el,v)=>{if(v&&el&&!el.value.trim()){el.value=v;hit.push(el)}};
  set(f.name,r.company); set(f.phone,r.phone); set(f.fax,r.fax); set(f.email,r.email);
  if(r.name||r.mobile||r.title){
    let box=[...f.querySelectorAll(".pbox")].find(b=>![...b.querySelectorAll("input")].some(i=>i.value.trim()));
    if(!box){$("#people").insertAdjacentHTML("beforeend",personBox());box=[...f.querySelectorAll(".pbox")].pop()}
    set(box.querySelector("[name=cn]"),r.name); set(box.querySelector("[name=ct]"),r.title); set(box.querySelector("[name=cp]"),r.mobile);
  }
  if(r.extra.length){const m=f.memo;const add=r.extra.join("\n");if(!m.value.includes(add)){m.value=(m.value?m.value+"\n":"")+add;hit.push(m)}}
  // 카테고리 추측
  const guess=[["숙박",/호텔|리조트|펜션|콘도|게스트|모텔|스테이|Hotel|Resort/i],["항공",/항공|에어|Air/i],["차량",/렌트|렌터카|버스|운수|교통|택시|모빌리티/],["유람선",/유람선|크루즈|요트|잠수함|마린/],["식당",/식당|횟집|레스토랑|가든|흑돼지|국수|해장|카페|밥상/],["체험관광",/체험|승마|카트|레저|랜드|농장 체험/],["토산품",/토산|특산|기념품|감귤|초콜릿/],["농수산",/농장|농원|수산|영농|과원|양식/],["관광지",/박물관|미술관|공원|파크|월드|테마|식물원|동굴/],["여행사",/여행사|여행|투어|Tour/i]];
  const g=guess.find(([c,re])=>data.categories.includes(c)&&re.test(r.company+" "+text));
  if(g&&f.category.value!==g[0]&&!f.name.dataset.touched){f.category.value=g[0];hit.push(f.category)}
  hit.forEach(el=>{el.classList.add("filled");setTimeout(()=>el.classList.remove("filled"),2500)});
  $(".card-in").open=false;
  toast(hit.length?`${hit.length}칸을 채웠어요. 확인 후 저장하세요`:"알아본 내용이 없어요. 직접 입력해 주세요");
}

function catEditor(){
  const rows=c=>`<div class="catrow"><span class="grip" title="끌어서 순서 바꾸기">⋮⋮</span><input class="in" value="${esc(c)}" data-old="${esc(c)}"><button type="button" data-rm>✕</button></div>`;
  openSheet(`<h2>카테고리 편집</h2><div class="note">왼쪽 <b>⋮⋮</b>를 잡고 위아래로 끌면 순서가 바뀌어요. 이름을 바꾸면 그 카테고리의 거래처도 함께 바뀌고, 거래처가 있는 카테고리는 지울 수 없어요.</div>
  <div id="cats">${data.categories.map(rows).join("")}</div>

  <div class="foot"><button class="btn ghost" id="cCancel">취소</button><button class="btn" id="cSave">저장</button></div>`);
  const box=$("#cats");
  box.onclick=e=>{const r=e.target.closest(".catrow");if(!r)return;
    if(e.target.dataset.rm!==undefined){const old=r.querySelector("input").dataset.old;
      if(old&&data.partners.some(p=>p.category===old)){toast(`'${old}'에 거래처가 있어 지울 수 없어요`);return}r.remove()}};
  // ⋮⋮ 손잡이로 끌어서 순서 바꾸기 (터치·마우스 모두)
  box.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".grip"); if(!g)return; e.preventDefault();
    const row=g.parentElement, sheet=$("#sheet"); row.classList.add("dragging");
    let timer=null, lastY=e.clientY;
    const place=y=>{let target=null;
      for(const s of box.children){if(s===row)continue;const r=s.getBoundingClientRect();if(y<r.top+r.height/2){target=s;break}}
      if(target!==row.nextElementSibling||target===null)box.insertBefore(row,target)};
    const scroll=()=>{const r=sheet.getBoundingClientRect();
      if(lastY<r.top+70)sheet.scrollTop-=10; else if(lastY>r.bottom-90)sheet.scrollTop+=10; place(lastY)};
    const mv=ev=>{lastY=ev.clientY;place(lastY)};
    const up=()=>{row.classList.remove("dragging");clearInterval(timer);
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up)};
    timer=setInterval(scroll,30);
    addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });
  $("#cAdd").onclick=()=>{box.insertAdjacentHTML("beforeend",rows(""));box.lastElementChild.querySelector("input").focus()};
  $("#cCancel").onclick=closeSheet;
  $("#cSave").onclick=async()=>{
    const ins=[...box.querySelectorAll("input")];const names=ins.map(i=>i.value.trim()).filter(Boolean);
    if(new Set(names).size!==names.length){toast("같은 이름이 있어요");return}
    const ren=ins.map(i=>[i.dataset.old,i.value.trim()]).filter(([o,n])=>o&&n&&o!==n);
    if(!names.includes(curCat))curCat="전체";closeSheet();
    await save("카테고리 수정",d=>{ren.forEach(([o,n])=>d.partners.forEach(p=>{if(p.category===o)p.category=n}));
      d.partners.forEach(p=>{if(!names.includes(p.category))names.push(p.category)}); d.categories=names});
  };
}

const mqDark=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":mqDark.matches};
function themeIcon(){$("#btnTheme").textContent=isDark()?"☀":"☾";$("#btnTheme").title=isDark()?"밝게 보기":"어둡게 보기"}
$("#btnTheme").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("pl_theme",t)}catch(e){};themeIcon()};
mqDark.addEventListener?.("change",themeIcon); themeIcon();
cfg=Object.assign(cfg,lsGet(LS.cfg)||{}); pw=lsGet(LS.pw)||""; apw=lsGet(LS.apw)||""; guessRepo();
function checkHash(){ if(location.hash==="#admin"&&!cfg.token){showAdminLock();return true} return false }
window.addEventListener("hashchange",checkHash);
if(!checkHash())load();
</script>
